name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: linux · ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64,  runner: ubuntu-latest,    flags: "",     extra: "", multiarch: "",     apt: "libsodium-dev" }
          - { arch: i686,    runner: ubuntu-latest,    flags: "-m32", multiarch: "i386", extra: "-DCMAKE_LIBRARY_ARCHITECTURE=i386-linux-gnu", apt: "gcc-multilib g++-multilib libsodium-dev:i386" }
          - { arch: aarch64, runner: ubuntu-24.04-arm, flags: "",     extra: "", multiarch: "",     apt: "libsodium-dev" }
    steps:
      - uses: actions/checkout@v4

      - name: Install libsodium
        run: |
          if [ -n "${{ matrix.multiarch }}" ]; then
            sudo dpkg --add-architecture "${{ matrix.multiarch }}"
          fi
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.apt }}

      - name: Configure
        env:
          TESS_ARCH: ${{ matrix.arch }}
          TESS_FLAGS: ${{ matrix.flags }}
          TESS_EXTRA: ${{ matrix.extra }}
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DTESS_WARNINGS_AS_ERRORS=ON \
            -DTESS_PACKAGE_ARCH="$TESS_ARCH" \
            -DCMAKE_C_FLAGS="$TESS_FLAGS" \
            -DCMAKE_CXX_FLAGS="$TESS_FLAGS" \
            -DCMAKE_EXE_LINKER_FLAGS="$TESS_FLAGS" \
            ${TESS_EXTRA}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Smoke test CLI
        run: |
          ./build/tesseract-crypt version
          ./build/tscrypt version

      - name: Package (CPack)
        run: cmake --build build --target package

      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          path: |
            build/*.tar.gz
            build/*.deb
          if-no-files-found: error

  macos:
    name: macos · universal2
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build universal libsodium (x86_64 + arm64)
        run: |
          curl -fsSL -o libsodium.tar.gz \
            https://github.com/jedisct1/libsodium/releases/download/1.0.20-RELEASE/libsodium-1.0.20.tar.gz
          tar xf libsodium.tar.gz
          cd libsodium-1.0.20
          ./configure --disable-shared --prefix="$PWD/../sodium-uni" \
            CC=clang \
            CFLAGS="-arch arm64 -arch x86_64 -O2" \
            LDFLAGS="-arch arm64 -arch x86_64"
          make -j"$(sysctl -n hw.ncpu)"
          make install

      - name: Configure
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DTESS_WARNINGS_AS_ERRORS=ON \
            -DTESS_PACKAGE_ARCH=universal2 \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_DISABLE_FIND_PACKAGE_unofficial-sodium=ON \
            -DSODIUM_LIBRARY="$PWD/sodium-uni/lib/libsodium.a" \
            -DSODIUM_INCLUDE_DIR="$PWD/sodium-uni/include"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Smoke test CLI
        run: |
          ./build/tesseract-crypt version
          ./build/tscrypt version

      - name: Package (CPack)
        run: cmake --build build --target package

      - uses: actions/upload-artifact@v4
        with:
          name: macos-universal2
          path: build/*.tar.gz
          if-no-files-found: error

  windows:
    name: windows · ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64,   vcpkg: x64-windows,   cmake_arch: x64,   tests: true,  installer: true }
          - { arch: x86,   vcpkg: x86-windows,   cmake_arch: Win32, tests: true,  installer: true }
          - { arch: arm64, vcpkg: arm64-windows, cmake_arch: ARM64, tests: false, installer: false }
    steps:
      - uses: actions/checkout@v4

      - name: Install libsodium (vcpkg)
        run: '& "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install libsodium:${{ matrix.vcpkg }}'

      - name: Configure
        run: >
          cmake -S . -B build -A ${{ matrix.cmake_arch }}
          -DTESS_WARNINGS_AS_ERRORS=ON
          -DTESS_PACKAGE_ARCH=${{ matrix.arch }}
          -DVCPKG_TARGET_TRIPLET=${{ matrix.vcpkg }}
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        if: matrix.tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package (CPack)
        run: cmake --build build --config Release --target package

      - name: Build Windows installer (Inno Setup)
        if: matrix.installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $ver = "${{ github.ref_name }}"
          if ($ver.StartsWith('v')) { $ver = $ver.Substring(1) }
          if (-not $ver) { $ver = "0.0.0" }
          New-Item -ItemType Directory -Force stage | Out-Null
          Copy-Item build/Release/tesseract-crypt.exe stage/
          Copy-Item build/Release/tscrypt.exe stage/
          Copy-Item LICENSE stage/
          $bin = "$env:VCPKG_INSTALLATION_ROOT/installed/${{ matrix.vcpkg }}/bin"
          Get-ChildItem $bin -Filter '*sodium*.dll' -ErrorAction SilentlyContinue |
            Copy-Item -Destination stage/
          $isccArgs = @("/DAppVersion=$ver")
          if ("${{ matrix.arch }}" -eq "x86") { $isccArgs += "/DArchX86" }
          & "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe" @isccArgs packaging/windows/tesseract-crypt.iss

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Get-ChildItem build -File -Filter '*.zip' -ErrorAction SilentlyContinue |
            Copy-Item -Destination dist/
          Get-ChildItem dist | ForEach-Object { Write-Host "artifact: $($_.Name)" }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: publish
    needs: [linux, macos, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "Tesseract Crypt $GITHUB_REF_NAME" \
              --generate-notes
          fi
