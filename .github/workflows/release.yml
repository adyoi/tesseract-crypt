name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: linux · ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x86_64,  runner: ubuntu-latest,    cc: "gcc",      flags: "",     multiarch: "",     apt: "" }
          - { arch: i686,    runner: ubuntu-latest,    cc: "gcc -m32", flags: "-m32", multiarch: "i386", apt: "gcc-multilib g++-multilib" }
          - { arch: aarch64, runner: ubuntu-24.04-arm, cc: "gcc",     flags: "",     multiarch: "",     apt: "" }
    steps:
      - uses: actions/checkout@v7

      - name: Install toolchain
        run: |
          if [ -n "${{ matrix.multiarch }}" ]; then
            sudo dpkg --add-architecture "${{ matrix.multiarch }}"
            sudo apt-get update
          fi
          if [ -n "${{ matrix.apt }}" ]; then
            sudo apt-get install -y ${{ matrix.apt }}
          fi

      - name: Build static libsodium
        env:
          TESS_CC: ${{ matrix.cc }}
          TESS_FLAGS: ${{ matrix.flags }}
        run: |
          curl -fsSL -o libsodium.tar.gz \
            https://github.com/jedisct1/libsodium/releases/download/1.0.20-RELEASE/libsodium-1.0.20.tar.gz
          echo "ebb65ef6ca439333c2bb41a0c1990587288da07f6c7fd07cb3a18cc18d30ce19  libsodium.tar.gz" | sha256sum -c -
          tar xf libsodium.tar.gz
          cd libsodium-1.0.20
          ./configure --disable-shared --enable-static \
            --prefix="$PWD/../sodium-static" \
            CC="$TESS_CC" CFLAGS="$TESS_FLAGS -O2 -fPIC"
          make -j"$(nproc)"
          make install

      - name: Configure
        env:
          TESS_ARCH: ${{ matrix.arch }}
          TESS_FLAGS: ${{ matrix.flags }}
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DTESS_WARNINGS_AS_ERRORS=ON \
            -DTESS_PACKAGE_ARCH="$TESS_ARCH" \
            -DCMAKE_DISABLE_FIND_PACKAGE_unofficial-sodium=ON \
            -DSODIUM_LIBRARY="$PWD/sodium-static/lib/libsodium.a" \
            -DSODIUM_INCLUDE_DIR="$PWD/sodium-static/include" \
            -DCMAKE_C_FLAGS="$TESS_FLAGS" \
            -DCMAKE_CXX_FLAGS="$TESS_FLAGS" \
            -DCMAKE_EXE_LINKER_FLAGS="$TESS_FLAGS"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Smoke test CLI (build tree)
        run: |
          ./build/tesseract-crypt version
          ./build/tscrypt version

      - name: Package (CPack)
        run: cmake --build build --target package

      - name: Smoke test packaged archive
        run: |
          mkdir -p smoke
          tar -xzf build/tesseract-crypt-*-Linux-*.tar.gz -C smoke
          ./smoke/tesseract-crypt-*/bin/tesseract-crypt version
          ./smoke/tesseract-crypt-*/bin/tscrypt version
          dpkg-deb -x build/tesseract-crypt_*.deb smoke-deb
          deb_bin=$(find smoke-deb -type f -name tesseract-crypt | head -n1)
          "$deb_bin" version

      # The packaged binaries must report the tag: TESS_VERSION_STRING is a
      # hand-maintained copy of the project version (see packaging/selftest.py),
      # so a forgotten bump would otherwise ship silently.
      - name: Verify version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          expect="tesseract-crypt ${GITHUB_REF_NAME#v}"
          for bin in smoke/tesseract-crypt-*/bin/tesseract-crypt smoke/tesseract-crypt-*/bin/tscrypt; do
            got="$("$bin" version)"
            echo "$bin -> $got"
            if [ "$got" != "$expect" ]; then
              echo "::error::$bin reports '$got', expected '$expect'"
              exit 1
            fi
          done
          deb_bin=$(find smoke-deb -type f -name tesseract-crypt | head -n1)
          got="$("$deb_bin" version)"
          echo "$deb_bin -> $got"
          if [ "$got" != "$expect" ]; then
            echo "::error::$deb_bin reports '$got', expected '$expect'"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: |
            build/*.tar.gz
            build/*.deb
          if-no-files-found: error

  macos:
    name: macos · universal2
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build universal libsodium (x86_64 + arm64)
        run: |
          curl -fsSL -o libsodium.tar.gz \
            https://github.com/jedisct1/libsodium/releases/download/1.0.20-RELEASE/libsodium-1.0.20.tar.gz
          echo "ebb65ef6ca439333c2bb41a0c1990587288da07f6c7fd07cb3a18cc18d30ce19  libsodium.tar.gz" | shasum -a 256 -c -
          tar xf libsodium.tar.gz
          cd libsodium-1.0.20
          ./configure --disable-shared --prefix="$PWD/../sodium-uni" \
            CC=clang \
            CFLAGS="-arch arm64 -arch x86_64 -O2" \
            LDFLAGS="-arch arm64 -arch x86_64"
          make -j"$(sysctl -n hw.ncpu)"
          make install

      - name: Configure
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DTESS_WARNINGS_AS_ERRORS=ON \
            -DTESS_PACKAGE_ARCH=universal2 \
            -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" \
            -DCMAKE_DISABLE_FIND_PACKAGE_unofficial-sodium=ON \
            -DSODIUM_LIBRARY="$PWD/sodium-uni/lib/libsodium.a" \
            -DSODIUM_INCLUDE_DIR="$PWD/sodium-uni/include"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Smoke test CLI
        run: |
          ./build/tesseract-crypt version
          ./build/tscrypt version

      - name: Ad-hoc codesign (macOS)
        run: |
          codesign --force --sign - build/tesseract-crypt
          codesign --force --sign - build/tscrypt

      - name: Package (CPack)
        run: cmake --build build --target package

      - name: Smoke test packaged archive
        run: |
          mkdir -p smoke
          tar -xzf build/tesseract-crypt-*-macOS-*.tar.gz -C smoke
          ./smoke/tesseract-crypt-*/bin/tesseract-crypt version
          ./smoke/tesseract-crypt-*/bin/tscrypt version

      - name: Verify version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          expect="tesseract-crypt ${GITHUB_REF_NAME#v}"
          for bin in smoke/tesseract-crypt-*/bin/tesseract-crypt smoke/tesseract-crypt-*/bin/tscrypt; do
            got="$("$bin" version)"
            echo "$bin -> $got"
            if [ "$got" != "$expect" ]; then
              echo "::error::$bin reports '$got', expected '$expect'"
              exit 1
            fi
          done

      - uses: actions/upload-artifact@v7
        with:
          name: macos-universal2
          path: build/*.tar.gz
          if-no-files-found: error

  windows:
    name: windows · ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: x64,   vcpkg: x64-windows,   cmake_arch: x64,   tests: true,  installer: true }
          - { arch: x86,   vcpkg: x86-windows,   cmake_arch: Win32, tests: true,  installer: true }
          - { arch: arm64, vcpkg: arm64-windows, cmake_arch: ARM64, tests: false, installer: false }
    steps:
      - uses: actions/checkout@v7

      - name: Cache vcpkg installed tree
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/vcpkg_installed
          key: vcpkg-${{ runner.os }}-${{ matrix.vcpkg }}-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ runner.os }}-${{ matrix.vcpkg }}-

      - name: Configure (manifest mode)
        run: >
          cmake -S . -B build -A ${{ matrix.cmake_arch }}
          -DTESS_WARNINGS_AS_ERRORS=ON
          -DTESS_PACKAGE_ARCH=${{ matrix.arch }}
          -DVCPKG_TARGET_TRIPLET=${{ matrix.vcpkg }}
          -DVCPKG_INSTALLED_DIR="${{ github.workspace }}/vcpkg_installed"
          -DVCPKG_APPLOCAL_DEPS=OFF
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build --config Release --parallel

      # vcpkg's per-project applocal step races when several targets link in
      # parallel (all rewriting build/Release/libsodium.dll), so stage the DLL
      # once instead and keep applocal disabled.
      - name: Stage libsodium runtime DLL
        shell: pwsh
        run: |
          $bin = "${{ github.workspace }}/vcpkg_installed/${{ matrix.vcpkg }}/bin"
          Get-ChildItem $bin -Filter '*sodium*.dll' | Copy-Item -Destination build/Release -Force

      # Windows ships no VC++ runtime, so a machine without the redistributable
      # cannot start the executables (0xC0000135 STATUS_DLL_NOT_FOUND).  Stage
      # the runtime DLLs next to the binaries for the Inno Setup payload;
      # CMakeLists.txt bundles the same files into the CPack ZIP.
      - name: Stage VC++ runtime DLLs
        shell: pwsh
        run: |
          $arch = switch ("${{ matrix.arch }}") {
            'x86'   { 'x86' }
            'arm64' { 'arm64' }
            default { 'x64' }
          }
          # vcruntime140_1.dll only exists for the 64-bit targets, so copy
          # whatever the redistributable provides and remember it for the
          # package check below.
          $wanted = @('msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll')
          $roots = @()
          if ($env:VCToolsRedistDir) { $roots += $env:VCToolsRedistDir }
          $vswhere = "${env:ProgramFiles(x86)}/Microsoft Visual Studio/Installer/vswhere.exe"
          if (Test-Path $vswhere) {
            $vs = & $vswhere -latest -products * -property installationPath
            if ($vs) { $roots += (Join-Path $vs "VC/Redist/MSVC") }
          }
          # VCToolsRedistDir already points at one toolset version directory,
          # while the vswhere root holds one directory per version; accept both.
          $versionDirs = foreach ($root in $roots) {
            if (-not (Test-Path $root)) { continue }
            if (Test-Path (Join-Path $root $arch)) {
              $root
            } else {
              Get-ChildItem (Join-Path $root '*') -Directory -ErrorAction SilentlyContinue |
                ForEach-Object { $_.FullName }
            }
          }
          $crt = $versionDirs |
            ForEach-Object { Get-ChildItem (Join-Path $_ $arch) -Directory -Filter 'Microsoft.VC*.CRT' -ErrorAction SilentlyContinue } |
            Sort-Object FullName | Select-Object -Last 1
          if (-not $crt) { throw "VC++ runtime redistributable for $arch not found" }
          Write-Host "staging VC++ runtime from $($crt.FullName)"
          $staged = @()
          foreach ($dll in $wanted) {
            $src = Join-Path $crt.FullName $dll
            if (Test-Path $src) {
              Copy-Item $src -Destination build/Release -Force
              $staged += $dll
            }
          }
          foreach ($required in 'msvcp140.dll', 'vcruntime140.dll') {
            if ($staged -notcontains $required) { throw "$required is missing from $($crt.FullName)" }
          }
          "STAGED_RUNTIME_DLLS=$($staged -join ',')" | Out-File -FilePath $env:GITHUB_ENV -Append
          Get-ChildItem build/Release -Filter '*.dll' | ForEach-Object { Write-Host "staged: $($_.Name)" }

      - name: Test
        if: matrix.tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package (CPack)
        run: cmake --build build --config Release --target package

      - name: Verify package bundles runtime DLLs
        shell: pwsh
        run: |
          $zip = Get-Item build/tesseract-crypt-*-Windows-*.zip
          Expand-Archive $zip.FullName -DestinationPath smoke -Force
          $required = @('*sodium*.dll')
          if ($env:STAGED_RUNTIME_DLLS) { $required += $env:STAGED_RUNTIME_DLLS -split ',' }
          $missing = @()
          foreach ($pattern in $required) {
            if (-not (Get-ChildItem smoke -Recurse -Filter $pattern)) { $missing += $pattern }
          }
          if ($missing) {
            Get-ChildItem smoke -Recurse -File | ForEach-Object { Write-Host "in zip: $($_.FullName)" }
            throw "runtime DLL(s) missing from $($zip.Name): $($missing -join ', ')"
          }
          Write-Host "bundled runtime DLLs: $($required -join ', ')"

      - name: Smoke test packaged archive
        if: matrix.tests
        shell: pwsh
        run: |
          $exe = Get-ChildItem smoke -Recurse -Filter tesseract-crypt.exe | Select-Object -First 1
          $alias = Get-ChildItem smoke -Recurse -Filter tscrypt.exe | Select-Object -First 1
          & $exe.FullName version
          & $alias.FullName version

      - name: Verify version matches tag
        if: matrix.tests && startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $expect = "tesseract-crypt " + $env:GITHUB_REF_NAME.TrimStart('v')
          foreach ($name in @('tesseract-crypt.exe', 'tscrypt.exe')) {
            $exe = Get-ChildItem smoke -Recurse -Filter $name | Select-Object -First 1
            $got = (& $exe.FullName version | Out-String).Trim()
            Write-Host "$($exe.Name) -> $got"
            if ($got -ne $expect) { throw "$($exe.Name) reports '$got', expected '$expect'" }
          }

      - name: Build Windows installer (Inno Setup)
        if: matrix.installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $ver = "${{ github.ref_name }}"
          if ($ver.StartsWith('v')) { $ver = $ver.Substring(1) }
          if (-not $ver) { $ver = "0.0.0" }
          New-Item -ItemType Directory -Force stage | Out-Null
          Copy-Item build/Release/tesseract-crypt.exe stage/
          Copy-Item build/Release/tscrypt.exe stage/
          Copy-Item LICENSE stage/
          # Runtime DLLs (libsodium + the VC++ runtime staged above) travel with
          # the executables so the installer works on a clean Windows.
          Copy-Item build/Release/*.dll stage/
          $isccArgs = @("/DAppVersion=$ver")
          if ("${{ matrix.arch }}" -eq "x86") { $isccArgs += "/DArchX86" }
          & "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe" @isccArgs packaging/windows/tesseract-crypt.iss

      - name: Collect artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Get-ChildItem build -File -Filter '*.zip' -ErrorAction SilentlyContinue |
            Copy-Item -Destination dist/
          Get-ChildItem dist | ForEach-Object { Write-Host "artifact: $($_.Name)" }

      - uses: actions/upload-artifact@v7
        with:
          name: windows-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  release:
    name: publish
    needs: [linux, macos, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      actions: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Generate SBOM (SPDX)
        # Pinned: third-party action (only actions/* keep their major tag).
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: dist
          format: spdx-json
          output-file: dist/tesseract-crypt-${{ github.ref_name }}.spdx.json
          upload-artifact: false

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*

      - name: Attest SBOM
        uses: actions/attest-sbom@v4
        with:
          subject-path: dist/*
          sbom-path: dist/tesseract-crypt-${{ github.ref_name }}.spdx.json

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "Tesseract Crypt $GITHUB_REF_NAME" \
              --generate-notes
          fi

      # The docs footer version is stamped from the latest release tag, but Pages
      # only rebuilds on pushes to main — and a release made with GITHUB_TOKEN
      # cannot trigger workflows by itself.  Ask for the rebuild explicitly so
      # the site shows this release instead of the previous one.
      - name: Refresh the version stamped on GitHub Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref "${{ github.event.repository.default_branch }}"

  # Runs in the same workflow run so it always follows a release: events
  # raised with GITHUB_TOKEN do not trigger workflows on their own.
  packages:
    name: publish to package managers
    needs: [release]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
    secrets: inherit
    uses: ./.github/workflows/packages.yml
    with:
      version: ${{ github.ref_name }}
