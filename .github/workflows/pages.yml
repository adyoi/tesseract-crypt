name: GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6

      - name: Install build deps, apt tooling, gnupg
        run: |
          sudo apt-get update
          sudo apt-get install -y libsodium-dev build-essential cmake apt-utils gnupg

      # The published site is docs/ + an APT repository built from the
      # CPack .deb.  The repo is signed with APT_SIGNING_KEY (armored secret
      # key, fingerprint hard-coded below); its public half is committed to
      # docs/apt/tesseract-crypt.asc.
      - name: Build & package Debian (.deb)
        shell: bash
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DTESS_WARNINGS_AS_ERRORS=ON
          cmake --build build --config Release --parallel
          cmake --build build --config Release --target package

      - name: Assemble site (docs + APT repo)
        shell: bash
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          APT_SIGNING_KEY_PASSPHRASE: ${{ secrets.APT_SIGNING_KEY_PASSPHRASE }}
        run: |
          set -euo pipefail
          rm -rf site apt-stage
          mkdir -p site
          cp -r docs/. site/
          DEB="$(ls build/*.deb 2>/dev/null | head -1 || true)"
          if [ -n "$DEB" ] && [ -n "$APT_SIGNING_KEY" ]; then
            printf '%s\n' "$APT_SIGNING_KEY" | gpg --batch --import
            # build into a staging root, then merge so docs/apt/tesseract-crypt.asc
            # (the committed public half of the signing key) survives the
            # script's `rm -rf $APT`.
            bash scripts/build-apt-repo.sh "$DEB" apt-stage \
              747E1BDB928B31017718FD38E1206C365D198C58
            cp -r apt-stage/. site/apt/
          else
            echo "APT_SIGNING_KEY or .deb missing — publishing docs only"
          fi
          find site -maxdepth 4 -type f | sort | head -30

      # The docs footer carries __VERSION__ so no HTML has to be edited for a
      # release; stamp it here.  Falls back to the CMake project version when
      # the release lookup fails (e.g. before the first release).
      - name: Stamp release version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)"
          if [ -z "$version" ]; then
            version="v$(sed -n 's/^ *VERSION *\([0-9][0-9.]*\)$/\1/p' CMakeLists.txt | head -1)"
          fi
          echo "stamping site with $version"
          grep -rl '__VERSION__' site --include='*.html' | xargs -r sed -i "s|__VERSION__|$version|g"
          if grep -rn '__VERSION__' site --include='*.html'; then
            echo "::error::unreplaced __VERSION__ placeholder"
            exit 1
          fi

      - name: Upload site/
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy ke GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5