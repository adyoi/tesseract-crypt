name: GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/configure-pages@v6

      - name: Install APT tooling and gnupg
        run: |
          sudo apt-get update
          sudo apt-get install -y apt-utils gnupg

      # The published site is docs/ + an APT repository.  The package it serves
      # is the .deb built by the release workflow instead of one rebuilt here:
      # every user then installs the same artifact that was built from the tag,
      # statically linked against libsodium (so no runtime dependency on
      # libsodium23) and covered by the release attestation, which is verified
      # before the package is signed into the repository.  The repo itself is
      # signed with APT_SIGNING_KEY (armored secret key, fingerprint hard-coded
      # below); its public half is committed to docs/apt/tesseract-crypt.asc.
      - name: Fetch the attested .deb from the latest release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)"
          deb=""
          if [ -n "$tag" ]; then
            deb="tesseract-crypt_${tag#v}_amd64.deb"
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
              --pattern "$deb" -D dist 2>/dev/null || deb=""
          fi
          if [ -z "$deb" ]; then
            echo "::warning::no released .deb found — the APT repository was not published"
            exit 0
          fi
          # Loud on purpose: a package whose provenance cannot be traced to
          # this repository's release workflow must never be signed into the
          # APT repository.
          gh attestation verify "dist/$deb" --repo "$GITHUB_REPOSITORY"
          {
            echo "DEB=dist/$deb"
            echo "RELEASE_TAG=$tag"
          } >> "$GITHUB_ENV"

      - name: Assemble site (docs + APT repo)
        shell: bash
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          APT_SIGNING_KEY_PASSPHRASE: ${{ secrets.APT_SIGNING_KEY_PASSPHRASE }}
        run: |
          set -euo pipefail
          rm -rf site apt-stage
          mkdir -p site
          cp -r docs/. site/
          DEB="${DEB:-}"
          if [ -n "$DEB" ] && [ -n "$APT_SIGNING_KEY" ]; then
            printf '%s\n' "$APT_SIGNING_KEY" | gpg --batch --import
            # build into a staging root, then merge so docs/apt/tesseract-crypt.asc
            # (the committed public half of the signing key) survives the
            # script's `rm -rf $APT`.
            #
            # Signing key: RSA 4096, expires 2027-10-16.  To rotate it, generate
            # a new key, update this fingerprint and docs/apt/tesseract-crypt.asc,
            # and refresh the APT_SIGNING_KEY / APT_SIGNING_KEY_PASSPHRASE secrets.
            bash scripts/build-apt-repo.sh "$DEB" apt-stage \
              7C2027584065349E9B1A21A4374ED7B8C78B6673
            cp -r apt-stage/. site/apt/
          else
            echo "publishing docs only"
            if [ -z "$DEB" ]; then
              echo "::warning::no released .deb — the APT repository was not published"
            else
              echo "::warning::APT_SIGNING_KEY is not set — the APT repository was not published, but the site still documents 'apt install tesseract-crypt'"
            fi
          fi
          find site -maxdepth 4 -type f | sort | head -30

      # The docs footer carries __VERSION__ so no HTML has to be edited for a
      # release; stamp it here.  RELEASE_TAG comes from the .deb fetch above;
      # fall back to the CMake project version when there is no release yet.
      - name: Stamp release version
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG:-}"
          if [ -z "$version" ]; then
            version="v$(sed -n 's/^ *VERSION *\([0-9][0-9.]*\)$/\1/p' CMakeLists.txt | head -1)"
          fi
          echo "stamping site with $version"
          grep -rl '__VERSION__' site --include='*.html' | xargs -r sed -i "s|__VERSION__|$version|g"
          if grep -rn '__VERSION__' site --include='*.html'; then
            echo "::error::unreplaced __VERSION__ placeholder"
            exit 1
          fi

      - name: Upload site/
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy ke GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5