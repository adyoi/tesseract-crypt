name: Packages

# Renders Homebrew / Scoop / Chocolatey / Winget metadata from a GitHub release
# and publishes it.  Steps that talk to third-party registries are skipped when
# their secret is not configured, so the job stays green before setup.
#
# Required repository secrets to fully enable publishing:
#   PACKAGES_TOKEN      PAT with `repo` scope (pushes tap/bucket, opens winget PR)
#   CHOCOLATEY_API_KEY  API key from https://push.chocolatey.org/account

on:
  # Called by release.yml right after the GitHub release is created (events
  # raised by GITHUB_TOKEN do not trigger other workflows on their own).
  workflow_call:
    inputs:
      version:
        description: "Release tag to publish, e.g. v1.0.2"
        required: true
        type: string
  # Kept for releases published by other means, plus manual backfills.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to publish, e.g. v1.0.2"
        required: true
        type: string

jobs:
  manifests:
    name: Homebrew · Scoop · Winget
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
      TAG: ${{ inputs.version || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v7

      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$TAG" -D dist --repo "$GITHUB_REPOSITORY"

      - name: Render manifests
        run: python3 packaging/render.py --version "${TAG#v}" --dist dist --out out

      - name: Publish Homebrew formula
        if: ${{ env.PACKAGES_TOKEN != '' }}
        run: |
          set -euo pipefail
          git clone --depth 1 \
            "https://x-access-token:${PACKAGES_TOKEN}@github.com/adyoi/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp out/homebrew/tesseract-crypt.rb tap/Formula/tesseract-crypt.rb
          cd tap
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/tesseract-crypt.rb
          if git diff --cached --quiet; then echo "Homebrew formula unchanged"; exit 0; fi
          git commit -m "tesseract-crypt ${TAG#v}"
          git push

      - name: Publish Scoop manifest
        if: ${{ env.PACKAGES_TOKEN != '' }}
        run: |
          set -euo pipefail
          git clone --depth 1 \
            "https://x-access-token:${PACKAGES_TOKEN}@github.com/adyoi/scoop-bucket.git" bucket
          cp out/scoop/tesseract-crypt.json bucket/tesseract-crypt.json
          cd bucket
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tesseract-crypt.json
          if git diff --cached --quiet; then echo "Scoop manifest unchanged"; exit 0; fi
          git commit -m "tesseract-crypt ${TAG#v}"
          git push

      # winget-releaser can only *update* a package that already exists in
      # microsoft/winget-pkgs; a first submission has to be made by hand once.
      # Skip the step (with a notice) instead of failing the whole run.
      - name: Check Winget package
        id: winget
        if: ${{ env.PACKAGES_TOKEN != '' }}
        env:
          GH_TOKEN: ${{ env.PACKAGES_TOKEN }}
        run: |
          set -euo pipefail
          if gh api "repos/microsoft/winget-pkgs/contents/manifests/a/adyoi/tesseract-crypt" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::adyoi.tesseract-crypt is not in microsoft/winget-pkgs yet; skipping Winget."
          fi

      - name: Publish to Winget
        if: ${{ env.PACKAGES_TOKEN != '' && steps.winget.outputs.exists == 'true' }}
        # Pinned: this third-party action receives PACKAGES_TOKEN (repo scope).
        uses: vedantmgoyal2009/winget-releaser@b7370d4d152efdce803a26cc6ca9eee58cb2ad54 # v2
        with:
          identifier: adyoi.tesseract-crypt
          installers-regex: 'windows-.*-setup\.exe$'
          release-tag: ${{ env.TAG }}
          token: ${{ env.PACKAGES_TOKEN }}

  chocolatey:
    name: Chocolatey
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      CHOCOLATEY_API_KEY: ${{ secrets.CHOCOLATEY_API_KEY }}
      TAG: ${{ inputs.version || github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v7

      - name: Download release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$TAG" -D dist --repo "$GITHUB_REPOSITORY"

      - name: Render manifests
        shell: bash
        run: python packaging/render.py --version "${TAG#v}" --dist dist --out out

      - name: Pack
        shell: pwsh
        run: choco pack out/chocolatey/tesseract-crypt.nuspec --outdir out/chocolatey

      # Pushing a version the community feed already knows about (published or
      # still in moderation) is at best a no-op, so backfills of an existing
      # tag stay green instead of failing the job.
      - name: Check Chocolatey package
        id: choco
        shell: bash
        run: |
          set -euo pipefail
          version="${TAG#v}"
          url="https://community.chocolatey.org/api/v2/Packages(Id='tesseract-crypt',Version='${version}')"
          if curl -fs -o /dev/null "$url"; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::tesseract-crypt ${version} is already on the community feed; skipping the push."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push to Chocolatey
        if: ${{ env.CHOCOLATEY_API_KEY != '' && steps.choco.outputs.published != 'true' }}
        shell: pwsh
        run: |
          $pkg = Get-ChildItem out/chocolatey/*.nupkg | Select-Object -First 1
          choco push $pkg.FullName --source https://push.chocolatey.org/ --api-key $env:CHOCOLATEY_API_KEY
