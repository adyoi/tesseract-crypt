name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "gcc  · Release", cc: gcc,   cxx: g++,     type: Release }
          - { name: "gcc  · Debug",   cc: gcc,   cxx: g++,     type: Debug }
          - { name: "clang · Release", cc: clang, cxx: clang++, type: Release }
          - { name: "clang · Debug",   cc: clang, cxx: clang++, type: Debug }
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v7

      - name: Install libsodium
        run: |
          sudo apt-get update
          sudo apt-get install -y libsodium-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.type }} -DTESS_WARNINGS_AS_ERRORS=ON

      - name: Static analysis (clang-tidy)
        if: matrix.cc == 'clang'
        run: |
          cmake -S . -B build-tidy -DCMAKE_BUILD_TYPE=${{ matrix.type }} \
            -DCMAKE_C_CLANG_TIDY="clang-tidy;-checks=*;-Werror" \
            -DCMAKE_CXX_CLANG_TIDY="clang-tidy;-checks=*;-Werror"
          cmake --build build-tidy --parallel 2>&1 | head -100

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Smoke test CLI (canonical name + alias)
        run: |
          ./build/tesseract-crypt version
          ./build/tesseract-crypt help >/dev/null
          ./build/tscrypt version

  sanitize:
    name: ASan + UBSan (clang)
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v7

      - name: Install libsodium
        run: |
          sudo apt-get update
          sudo apt-get install -y libsodium-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DTESS_SANITIZE=ON -DTESS_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build --output-on-failure

  windows:
    name: MSVC · Release (vcpkg)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install deps (vcpkg manifest)
        run: '& "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install --x-manifest-root=.'

      - name: Configure
        run: >
          cmake -S . -B build
          -DTESS_WARNINGS_AS_ERRORS=ON
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Smoke test CLI (canonical name + alias)
        run: |
          ./build/Release/tesseract-crypt.exe version
          ./build/Release/tscrypt.exe version

  macos:
    name: AppleClang · Release
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install libsodium
        run: brew install libsodium

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DTESS_WARNINGS_AS_ERRORS=ON
          -DCMAKE_PREFIX_PATH=$(brew --prefix)

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Smoke test CLI (canonical name + alias)
        run: |
          ./build/tesseract-crypt version
          ./build/tscrypt version

  fuzz:
    name: Fuzz (libFuzzer · 60 s/target)
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v7

      - name: Install libsodium
        run: |
          sudo apt-get update
          sudo apt-get install -y libsodium-dev

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DTESS_FUZZ=ON
          -DTESS_BUILD_TESTS=OFF
          -DTESS_BUILD_CLI=OFF
          -DTESS_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Fuzz smoke (60 seconds per target)
        run: |
          ./build/fuzz_inspect   -max_total_time=60 -timeout=5 -rss_limit_mb=2048 -print_final_stats=1
          ./build/fuzz_dearmor   -max_total_time=60 -timeout=5 -rss_limit_mb=2048 -print_final_stats=1
          ./build/fuzz_key_parse -max_total_time=60 -timeout=5 -rss_limit_mb=2048 -print_final_stats=1
          ./build/fuzz_open      -max_total_time=60 -timeout=5 -rss_limit_mb=2048 -print_final_stats=1

  coverage:
    name: Coverage (gcc · lcov)
    runs-on: ubuntu-latest
    env:
      CC: gcc
      CXX: g++
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsodium-dev lcov

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DTESS_COVERAGE=ON
          -DTESS_WARNINGS_AS_ERRORS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Generate coverage
        run: |
          lcov --capture --directory build --output-file coverage.info
          lcov --remove coverage.info '*/tests/*' '*/fuzz/*' '/usr/*' --output-file coverage-filtered.info

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage-filtered.info
          fail_ci_if_error: false